name: Publish on NuGet

# Publishes Mafe.RestClient and Mafe.RestClient.Extensions.DependencyInjection:
# - when a version tag is pushed:
#     git tag v2.0.0 && git push origin v2.0.0
#   the tag must match <Version> in both src/RestClient/RestClient.csproj and
#   src/RestClient.Extensions.DependencyInjection/RestClient.Extensions.DependencyInjection.csproj;
# - manually, from GitHub: Actions > Publish on NuGet > Run workflow (publishes the <Version> of the selected branch,
#   the two projects must have the same version).
# Merging into master does NOT publish anything.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Check the project versions
      run: |
        # Tag push: the expected version comes from the tag (v2.0.0 -> 2.0.0).
        # Manual run: the expected version is the one of Mafe.RestClient, the other packages must match it.
        if [ "$GITHUB_REF_TYPE" = "tag" ]; then
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
        else
          EXPECTED_VERSION="$(dotnet msbuild src/RestClient/RestClient.csproj -getProperty:Version)"
        fi
        echo "expected version: $EXPECTED_VERSION"
        for PROJECT in src/RestClient/RestClient.csproj src/RestClient.Extensions.DependencyInjection/RestClient.Extensions.DependencyInjection.csproj; do
          PROJECT_VERSION="$(dotnet msbuild "$PROJECT" -getProperty:Version)"
          echo "$PROJECT: $PROJECT_VERSION"
          if [ "$EXPECTED_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::$PROJECT has version $PROJECT_VERSION, expected $EXPECTED_VERSION ($GITHUB_REF_TYPE $GITHUB_REF_NAME)"
            exit 1
          fi
        done

    - name: Restore dependencies
      run: dotnet restore src/RestClient.sln

    - name: Build
      run: dotnet build -c Release --no-restore src/RestClient.sln

    - name: Test
      run: |
        dotnet test -c Release --no-build -f net10.0 tests/RestClient.Tests/RestClient.Tests.csproj
        dotnet test -c Release --no-build -f net8.0 tests/RestClient.Tests/RestClient.Tests.csproj

    - name: Install the Native AOT prerequisites
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

    - name: Native AOT smoke test
      run: |
        dotnet publish -c Release -r linux-x64 -o ./aot tests/RestClient.AotSmokeTest/RestClient.AotSmokeTest.csproj
        ./aot/RestClient.AotSmokeTest

    - name: Package
      run: dotnet pack -c Release --no-build -o ./artifacts src/RestClient.sln

    - name: Publish on NuGet
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
