name: CI

on:
  pull_request:
  push:
    branches-ignore: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Build
      run: dotnet build -c Release src/RestClient.sln

    - name: Test (net10.0, net8.0, net48)
      run: dotnet test -c Release --no-build tests/RestClient.Tests/RestClient.Tests.csproj
