name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Build
      run: dotnet build -c Release src/RestClient.sln

    - name: Test (net10.0, net8.0, net48)
      run: dotnet test -c Release --no-build tests/RestClient.Tests/RestClient.Tests.csproj

    - name: Package (package validation)
      run: dotnet pack -c Release --no-build -o ./artifacts src/RestClient.sln

  native-aot:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install the Native AOT prerequisites
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

    - name: Publish Native AOT smoke test (trimming/AOT warnings are errors)
      run: dotnet publish -c Release -r linux-x64 -o ./aot tests/RestClient.AotSmokeTest/RestClient.AotSmokeTest.csproj

    - name: Run Native AOT smoke test
      run: ./aot/RestClient.AotSmokeTest
