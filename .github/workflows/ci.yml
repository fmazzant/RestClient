name: CI

on:
  pull_request:
    paths-ignore: [ '**.md' ]
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # the tests run on net10.0 and net8.0 everywhere, and on net48 on Windows only
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Build
      run: dotnet build -c Release src/RestClient.sln

    - name: Test
      run: >
        dotnet test -c Release --no-build tests/RestClient.Tests/RestClient.Tests.csproj
        --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Coverage report
      if: matrix.os == 'ubuntu-latest'
      uses: danielpalme/ReportGenerator-GitHub-Action@v5
      with:
        reports: coverage/**/coverage.cobertura.xml
        targetdir: coverage-report
        reporttypes: MarkdownSummaryGithub
        assemblyfilters: +Mafesoft.RestClient*

    - name: Publish the coverage in the job summary
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

    - name: Build the samples
      run: dotnet build -c Release samples/RestClient.Samples.sln

    - name: Package (package validation)
      if: matrix.os == 'windows-latest'
      run: dotnet pack -c Release --no-build -o ./artifacts src/RestClient.sln

  native-aot:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Install the Native AOT prerequisites
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

    - name: Publish Native AOT smoke test (trimming/AOT warnings are errors)
      run: dotnet publish -c Release -r linux-x64 -o ./aot tests/RestClient.AotSmokeTest/RestClient.AotSmokeTest.csproj

    - name: Run Native AOT smoke test
      run: ./aot/RestClient.AotSmokeTest
