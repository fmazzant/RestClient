# Dependabot version updates.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "/src/RestClient"
      - "/src/RestClient.Extensions.DependencyInjection"
      - "/src/RestClient.Testing"
      - "/tests/RestClient.AotSmokeTest"
      - "/tests/RestClient.Tests"
      - "/samples/RestClient.Samples.AspNetCore"
      - "/samples/RestClient.Samples.Console"
      - "/samples/RestClient.Samples.NativeAot"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: [ "*" ]
