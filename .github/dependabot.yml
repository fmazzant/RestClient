# Dependabot version updates.
#
# DISABLED for now: open-pull-requests-limit: 0 stops the version-update PRs
# (security updates, if enabled in the repository settings, are not affected).
# To enable: set open-pull-requests-limit to 5 in both entries.
version: 2
updates:
  - package-ecosystem: nuget
    directory: 
      - "/src/RestClient"
  - "/src/RestClient.Extensions.DependencyInjection"
  - "/src/RestClient.Testing"
  - "/tests/RestClient.AotSmokeTest"
  - "/tests/RestClient.Tests"
  - "/samples/RestClient.Samples.AspNetCore"
  - "/samples/RestClient.Samples.Console"
  - "/samples/RestClient.Samples.NativeAot"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types: [ minor, patch ]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: [ "*" ]
